<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D7377"/>
      <stop offset="100%" style="stop-color:#14A3A8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A843"/>
      <stop offset="100%" style="stop-color:#E8C76A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)"/>

  <!-- Decorative geometric borders (Islamic-art inspired) -->
  <rect x="24" y="24" width="464" height="464" rx="88" ry="88"
        fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.4"/>
  <rect x="40" y="40" width="432" height="432" rx="76" ry="76"
        fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.2"/>

  <!-- Heart silhouette (Quloob = Hearts) -->
  <path d="M256 420
           C256 420 120 320 120 220
           C120 170 160 130 210 130
           C235 130 256 148 256 148
           C256 148 277 130 302 130
           C352 130 392 170 392 220
           C392 320 256 420 256 420Z"
        fill="url(#gold)" opacity="0.15"/>

  <!-- Arabic Alef with Hamza -->
  <text x="256" y="330"
        text-anchor="middle"
        fill="white"
        font-family="'Noto Naskh Arabic','Traditional Arabic',serif"
        font-size="260"
        font-weight="bold">أ</text>

  <!-- Three decorative dots -->
  <circle cx="180" cy="440" r="4" fill="url(#gold)" opacity="0.5"/>
  <circle cx="256" cy="450" r="4" fill="url(#gold)" opacity="0.5"/>
  <circle cx="332" cy="440" r="4" fill="url(#gold)" opacity="0.5"/>
</svg>
